spring:
  application:
    name: spring-batch-phone-scoring

  # ── Batch ─────────────────────────────────────────────────────────────────
  batch:
    job:
      enabled: false          # disable auto-run on startup; scheduler controls execution
    jdbc:
      initialize-schema: always

  # ── Database (primary – feature store) ────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/phone_scoring}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PrimaryPool
      maximum-pool-size: 10

  # ── JPA ───────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

# ── AWS ───────────────────────────────────────────────────────────────────
cloud:
  aws:
    region:
      static: ${AWS_REGION:us-east-1}

# ── Application-specific settings ─────────────────────────────────────────
app:
  batch:
    schedule:
      cron: "0 0 5 * * ?"   # daily at 05:00 AM

  dialer:
    provider: five9          # five9 | aws-connect

  ai:
    provider: bedrock        # bedrock | mock
    bedrock:
      region: ${AWS_REGION:us-east-1}
      model-id: anthropic.claude-v2
      max-tokens: 1024
      temperature: 0.7

  sources:
    api:
      base-url: ${API_SOURCE_URL:http://localhost:8081}
    db:
      use-replica: false     # set to true and configure replica datasource in production
    s3:
      enabled: false
      bucket-name: ${S3_BUCKET:phone-analytics-bucket}
      object-key: ${S3_KEY:analytics/answer-rates.csv}

# ── Logging ───────────────────────────────────────────────────────────────
logging:
  level:
    com.poc.springbatch: INFO
    org.springframework.batch: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
