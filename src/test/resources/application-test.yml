spring:
  application:
    name: spring-batch-phone-scoring-test

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

app:
  dialer:
    provider: five9
  ai:
    provider: mock
  sources:
    api:
      base-url: http://localhost:8081
    db:
      use-replica: false
    s3:
      enabled: false
      bucket-name: test-bucket
      object-key: test-key

logging:
  level:
    com.poc.springbatch: DEBUG
    org.springframework.batch: WARN
