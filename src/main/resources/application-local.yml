# ── Local Development Profile ─────────────────────────────────────────────
# Activated with: mvn spring-boot:run -Dspring-boot.run.profiles=local
# Or via IDE with active profile "local"
#
# Spring Boot Docker Compose support will automatically start/stop the
# PostgreSQL container defined in compose.yml when this profile is active.

spring:
  # ── Docker Compose ──────────────────────────────────────────────────────
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
      file: compose.yml

  # ── Database – auto-configured by Docker Compose support ────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/phone_scoring
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway ──────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

# ── AI – use mock locally (no AWS credentials needed) ─────────────────────
app:
  ai:
    provider: mock

  dialer:
    provider: five9

  sources:
    api:
      base-url: http://localhost:8081
    db:
      use-replica: false
    s3:
      enabled: false

logging:
  level:
    com.poc.springbatch: DEBUG
    org.springframework.batch: INFO
    org.springframework.boot.docker.compose: DEBUG
